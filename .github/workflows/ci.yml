name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Quality Checks
    runs-on: ubuntu-latest

    env:
      DATABASE_PATH: ':memory:'
      CREDENTIAL_ENCRYPTION_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef
      BETTER_AUTH_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Code style & lint
        run: pnpm lint

      - name: TypeScript typecheck
        run: pnpm typecheck

      - name: Run unit & integration tests
        run: pnpm test

  native:
    name: Native Shell Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: native/pnpm-lock.yaml

      - name: Install native dependencies
        run: pnpm -C native install --frozen-lockfile

      - name: TypeScript typecheck
        run: pnpm -C native -r typecheck

      - name: Run unit tests
        run: pnpm -C native -r test

      - name: Build shell UI and desktop bundles
        run: pnpm -C native/desktop build

  android:
    name: Android Debug Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: native/pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build web assets and sync Capacitor
        run: |
          pnpm -C native install --frozen-lockfile
          pnpm -C native/mobile build
          pnpm -C native/mobile exec cap sync android

      - name: Build debug APK
        working-directory: native/mobile/android
        run: ./gradlew assembleDebug

  docker-smoke:
    name: Docker Build Smoke Test
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (dry-run, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desktop-smoke:
    name: Desktop Packaging Smoke (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --linux AppImage deb rpm --x64
          - os: windows-latest
            args: --win zip --x64 && pnpm -C native/desktop dist --win nsis --x64
          - os: macos-15-intel
            args: --mac dmg --x64
          - os: macos-latest
            args: --mac dmg --arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml
            native/pnpm-lock.yaml

      - name: Install rpm tooling
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Install dependencies
        # pwsh on Windows checks only the last command's exit code.
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm -C native install --frozen-lockfile

      - name: Build local standalone server and verify Electron SQLite ABI
        # pwsh on Windows checks only the last command's exit code.
        shell: bash
        env:
          DOCKER_BUILD: '1'
          DATABASE_PATH: ':memory:'
          CREDENTIAL_ENCRYPTION_SECRET: build-dummy-credential-encryption-secret-min32
          BETTER_AUTH_SECRET: build-dummy-better-auth-secret-min-32-chars
        run: |
          pnpm build
          node native/desktop/scripts/build-server.mjs

      - name: Package desktop app (dry-run, publish never)
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm -C native/desktop dist ${{ matrix.args }}
