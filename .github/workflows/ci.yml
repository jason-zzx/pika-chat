name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Quality Checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pika
          POSTGRES_PASSWORD: pika
          POSTGRES_DB: pika_chat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://pika:pika@localhost:5432/pika_chat_test
      TEST_DATABASE_URL: postgres://pika:pika@localhost:5432/pika_chat_test
      CREDENTIAL_ENCRYPTION_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef
      BETTER_AUTH_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Code style & lint
        run: pnpm lint

      - name: TypeScript typecheck
        run: pnpm typecheck

      - name: Run unit & integration tests
        run: pnpm test

      - name: Run integration tests on PGlite
        run: pnpm vitest run --project integration
        env:
          PGLITE_DATA_DIR: memory://

  native:
    name: Native Shell Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: native/pnpm-lock.yaml

      - name: Install native dependencies
        run: pnpm -C native install --frozen-lockfile

      - name: TypeScript typecheck
        run: pnpm -C native -r typecheck

      - name: Run unit tests
        run: pnpm -C native -r test

      - name: Build shell UI and desktop bundles
        run: pnpm -C native/desktop build

  android:
    name: Android Debug Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: native/pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build web assets and sync Capacitor
        run: |
          pnpm -C native install --frozen-lockfile
          pnpm -C native/mobile build
          pnpm -C native/mobile exec cap sync android

      - name: Build debug APK
        working-directory: native/mobile/android
        run: ./gradlew assembleDebug

  docker-smoke:
    name: Docker Build Smoke Test
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (dry-run, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
