name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  quality-gate:
    name: Pre-release Quality Checks
    runs-on: ubuntu-latest

    env:
      DATABASE_PATH: ':memory:'
      CREDENTIAL_ENCRYPTION_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef
      BETTER_AUTH_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Code style & lint
        run: pnpm lint

      - name: TypeScript typecheck
        run: pnpm typecheck

      - name: Run unit & integration tests
        run: pnpm test

  build-docker:
    name: Build Docker Image (${{ matrix.platform }})
    needs: quality-gate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            slug: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata & labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=docker-${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.slug }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [ -z "$DIGEST" ]; then
            echo "Missing build digest" >&2
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v7
        with:
          name: docker-digest-${{ matrix.slug }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  build-and-push:
    name: Push Multi-Arch Docker Manifest
    needs: build-docker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download platform digests
        uses: actions/download-artifact@v8
        with:
          pattern: docker-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata & tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Create and push multi-arch manifest
        env:
          META_TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST_DIR: ${{ runner.temp }}/digests
          IMAGE_NAME: ghcr.io/${{ github.repository }}
        run: |
          args=()
          tag_count=0
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              args+=(-t "$tag")
              tag_count=$((tag_count + 1))
            fi
          done <<< "$META_TAGS"
          if [ "$tag_count" -eq 0 ]; then
            echo "No Docker tags generated for ref ${GITHUB_REF_NAME}; skipping manifest push."
            exit 0
          fi
          digest_count=0
          for file in "$DIGEST_DIR"/*; do
            if [ -f "$file" ]; then
              args+=("${IMAGE_NAME}@sha256:$(basename "$file")")
              digest_count=$((digest_count + 1))
            fi
          done
          if [ "$digest_count" -ne 2 ]; then
            echo "Expected 2 platform digests, found $digest_count" >&2
            exit 1
          fi
          docker buildx imagetools create "${args[@]}"
          first_tag="$(printf '%s\n' "$META_TAGS" | head -n 1)"
          docker buildx imagetools inspect "$first_tag"

  build-desktop:
    name: Build Desktop App (${{ matrix.os }})
    needs: quality-gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: desktop-linux
            args: --linux AppImage deb rpm --x64
          - os: windows-latest
            artifact: desktop-windows
            args: --win zip --x64 && pnpm -C native/desktop dist --win nsis --x64
          - os: macos-15-intel
            artifact: desktop-macos-x64
            args: --mac dmg --x64
          - os: macos-latest
            artifact: desktop-macos-arm64
            args: --mac dmg --arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml
            native/pnpm-lock.yaml

      - name: Verify tag matches package.json version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          if [ "v$(node -p "require('./package.json').version")" != "${{ github.ref_name }}" ]; then
            echo "Tag ${{ github.ref_name }} does not match package.json version" >&2
            exit 1
          fi

      - name: Install rpm tooling
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Install root and native dependencies
        # pwsh on Windows checks only the last command's exit code.
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm -C native install --frozen-lockfile

      - name: Build local standalone server and verify Electron SQLite ABI
        # pwsh on Windows checks only the last command's exit code.
        shell: bash
        # Next.js evaluates server modules during `next build` page-data collection;
        # pass dummy values matching Dockerfile so CI builds succeed without secrets.
        env:
          DOCKER_BUILD: '1'
          DATABASE_PATH: ':memory:'
          CREDENTIAL_ENCRYPTION_SECRET: build-dummy-credential-encryption-secret-min32
          BETTER_AUTH_SECRET: build-dummy-better-auth-secret-min-32-chars
        run: |
          pnpm build
          node native/desktop/scripts/build-server.mjs

      - name: Build and package desktop app
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm -C native/desktop dist ${{ matrix.args }}

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            native/desktop/release/*.exe
            native/desktop/release/*.zip
            native/desktop/release/*.dmg
            native/desktop/release/*.AppImage
            native/desktop/release/*.deb
            native/desktop/release/*.rpm
            native/desktop/release/*.blockmap
            native/desktop/release/latest*.yml
            !native/desktop/release/latest-mac.yml
          if-no-files-found: error

  build-android:
    name: Build Android APK
    needs: quality-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: native/pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify tag matches package.json version
        if: github.ref_type == 'tag'
        run: |
          if [ "v$(node -p "require('./package.json').version")" != "${{ github.ref_name }}" ]; then
            echo "Tag ${{ github.ref_name }} does not match package.json version" >&2
            exit 1
          fi

      - name: Build web assets and sync Capacitor
        run: |
          pnpm -C native install --frozen-lockfile
          pnpm -C native/mobile build
          pnpm -C native/mobile exec cap sync android

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pika-chat-release.p12"

      - name: Build signed release APK
        working-directory: native/mobile/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/pika-chat-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir android-assets
          cp native/mobile/android/app/build/outputs/apk/release/app-release.apk "android-assets/Pika-Chat-${version}.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: android-assets/*.apk
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: [build-and-push, build-desktop, build-android]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: desktop-assets
          merge-multiple: true

      - name: Download Android artifact
        uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: desktop-assets

      - name: Extract Release Notes from CHANGELOG
        id: notes
        run: |
          if node scripts/extract-changelog.mjs "${{ github.ref_name }}" > release_notes.md; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=(--title "${{ github.ref_name }}")
          if [ "${{ steps.notes.outputs.has_notes }}" = "true" ]; then
            args+=(--notes-file release_notes.md)
          else
            args+=(--generate-notes)
          fi
          case "${{ github.ref_name }}" in
            *-*) args+=(--prerelease) ;;
          esac
          gh release create "${{ github.ref_name }}" "${args[@]}" desktop-assets/*
