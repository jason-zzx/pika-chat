name: pika-chat-dev

services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pika}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pika}
      POSTGRES_DB: ${POSTGRES_DB:-pika_chat}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pika} -d ${POSTGRES_DB:-pika_chat}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_dev_data:
