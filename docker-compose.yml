services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: pika
      POSTGRES_PASSWORD: pika
      POSTGRES_DB: pika_chat
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pika -d pika_chat"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_dev_data:
