name: pika-chat

services:
  app:
    image: ${PIKA_IMAGE:-ghcr.io/jason-zzx/pika-chat:latest}
    # To build from local source instead, uncomment the line below:
    # build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      # Fixed to the mounted volume below; not read from .env, whose DATABASE_PATH is for local development.
      - DATABASE_PATH=/data/files/pika-chat.db
      - CREDENTIAL_ENCRYPTION_SECRET=${CREDENTIAL_ENCRYPTION_SECRET}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - FILE_STORAGE_DIR=${FILE_STORAGE_DIR:-/data/files}
      - FILE_UPLOAD_MAX_MB=${FILE_UPLOAD_MAX_MB:-20}
      - APP_URL=${APP_URL:-http://localhost:3000}
      - APP_TRUSTED_ORIGINS
      # Optional S3-compatible attachment storage:
      - S3_BUCKET
      - S3_ENDPOINT
      - S3_REGION
      - S3_ACCESS_KEY_ID
      - S3_SECRET_ACCESS_KEY
      - S3_DIRECT_ACCESS
    volumes:
      - files_prod_data:/data/files

volumes:
  files_prod_data:
